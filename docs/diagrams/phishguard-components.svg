<text x="170.0" y="542" text-anchor="middle" font-size="18" font-weight="600">Dataset + split manifest</text>
<rect x="850" y="490" width="250" height="90" fill="#f4f9fa" stroke="#28616b" stroke-width="2"/>
<text x="975.0" y="514" text-anchor="middle" font-size="15" font-weight="normal">&lt;&lt;artifact&gt;&gt;</text>
