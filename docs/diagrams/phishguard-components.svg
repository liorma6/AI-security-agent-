<text x="365" y="130" text-anchor="middle" font-size="15" font-weight="normal">uses</text>
<polyline points="300,205 355,205 355,295 430,295" fill="none" stroke="#28616b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#open)"/>
