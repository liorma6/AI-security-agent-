<text x="170.0" y="164" text-anchor="middle" font-size="15" font-weight="normal">&lt;&lt;component&gt;&gt;</text>
<text x="170.0" y="192" text-anchor="middle" font-size="18" font-weight="600">Gradio demo UI</text>
