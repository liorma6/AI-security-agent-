<text x="565.0" y="494" text-anchor="middle" font-size="15" font-weight="normal">&lt;&lt;component&gt;&gt;</text>
<text x="565.0" y="522" text-anchor="middle" font-size="18" font-weight="600">Offline experiment pipeline</text>
<text x="565.0" y="545" text-anchor="middle" font-size="18" font-weight="normal">prepare / train / perturb</text>
<text x="565.0" y="568" text-anchor="middle" font-size="18" font-weight="normal">evaluate / record results</text>
<rect x="40" y="490" width="260" height="90" fill="#f4f9fa" stroke="#28616b" stroke-width="2"/>
