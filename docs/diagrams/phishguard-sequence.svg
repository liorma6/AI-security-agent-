<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="800" viewBox="0 0 1140 800">
<title>Proposed pasted-email UML sequence diagram</title>
<defs><marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L10 6 L1 11" fill="none" stroke="#28616b" stroke-width="1.5"/></marker><marker id="closed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L9 5 L0 10 Z" fill="#28616b"/></marker></defs>
<rect width="1140" height="800" fill="white"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#153c44">
<text x="570" y="35" text-anchor="middle" font-size="25" font-weight="600">PhishGuard | UML sequence | Proposed inference</text>
<rect x="10" y="75" width="140" height="55" fill="#f4f9fa" stroke="#28616b" stroke-width="2"/>
<text x="80" y="108" text-anchor="middle" font-size="19" font-weight="600">Analyst</text>
<line x1="80" y1="130" x2="80" y2="730" stroke="#78949a" stroke-dasharray="7 5"/>
<rect x="230" y="75" width="140" height="55" fill="#f4f9fa" stroke="#28616b" stroke-width="2"/>
<text x="300" y="108" text-anchor="middle" font-size="19" font-weight="600">Demo UI</text>
<line x1="300" y1="130" x2="300" y2="730" stroke="#78949a" stroke-dasharray="7 5"/>
<rect x="470" y="75" width="140" height="55" fill="#f4f9fa" stroke="#28616b" stroke-width="2"/>
<text x="540" y="108" text-anchor="middle" font-size="19" font-weight="600">Validator</text>
<line x1="540" y1="130" x2="540" y2="730" stroke="#78949a" stroke-dasharray="7 5"/>
<rect x="690" y="75" width="140" height="55" fill="#f4f9fa" stroke="#28616b" stroke-width="2"/>
<text x="760" y="108" text-anchor="middle" font-size="19" font-weight="600">Model</text>
<line x1="760" y1="130" x2="760" y2="730" stroke="#78949a" stroke-dasharray="7 5"/>
<rect x="920" y="75" width="140" height="55" fill="#f4f9fa" stroke="#28616b" stroke-width="2"/>
<text x="990" y="108" text-anchor="middle" font-size="19" font-weight="600">Explanation</text>
<line x1="990" y1="130" x2="990" y2="730" stroke="#78949a" stroke-dasharray="7 5"/>
<line x1="80" y1="175" x2="300" y2="175" stroke="#28616b" stroke-width="2" marker-end="url(#closed)"/>
<text x="190.0" y="165" text-anchor="middle" font-size="16" font-weight="normal">paste email</text>
<line x1="300" y1="225" x2="540" y2="225" stroke="#28616b" stroke-width="2" marker-end="url(#closed)"/>
<text x="420.0" y="215" text-anchor="middle" font-size="16" font-weight="normal">validate(text)</text>
<rect x="25" y="255" width="1080" height="450" fill="none" stroke="#28616b" stroke-width="2"/>
<path d="M25 285 H85 L100 270 V255" fill="none" stroke="#28616b" stroke-width="2"/>
<text x="58" y="276" text-anchor="middle" font-size="17" font-weight="normal">alt</text>
<text x="125" y="280" text-anchor="start" font-size="16" font-weight="normal">[invalid input]</text>
<line x1="540" y1="315" x2="300" y2="315" stroke="#28616b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#open)"/>
<text x="420.0" y="305" text-anchor="middle" font-size="16" font-weight="normal">validation error</text>
<line x1="300" y1="355" x2="80" y2="355" stroke="#28616b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#open)"/>
<text x="190.0" y="345" text-anchor="middle" font-size="16" font-weight="normal">show error</text>
<line x1="25" y1="385" x2="1105" y2="385" stroke="#28616b" stroke-dasharray="7 5"/>
<text x="125" y="410" text-anchor="start" font-size="16" font-weight="normal">[valid input]</text>
<line x1="540" y1="445" x2="300" y2="445" stroke="#28616b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#open)"/>
<text x="420.0" y="435" text-anchor="middle" font-size="16" font-weight="normal">validated input + length status</text>
<line x1="300" y1="490" x2="760" y2="490" stroke="#28616b" stroke-width="2" marker-end="url(#closed)"/>
<text x="530.0" y="480" text-anchor="middle" font-size="16" font-weight="normal">predict(text, reviewed model)</text>
<line x1="760" y1="535" x2="300" y2="535" stroke="#28616b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#open)"/>
<text x="530.0" y="525" text-anchor="middle" font-size="16" font-weight="normal">score + label + model revision</text>
<line x1="300" y1="580" x2="990" y2="580" stroke="#28616b" stroke-width="2" marker-end="url(#closed)"/>
<text x="645.0" y="570" text-anchor="middle" font-size="16" font-weight="normal">explain(text, prediction)</text>
<line x1="990" y1="625" x2="300" y2="625" stroke="#28616b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#open)"/>
<text x="645.0" y="615" text-anchor="middle" font-size="16" font-weight="normal">evidence indicators + limitations</text>
<line x1="300" y1="670" x2="80" y2="670" stroke="#28616b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#open)"/>
<text x="190.0" y="660" text-anchor="middle" font-size="16" font-weight="normal">show result</text>
<text x="570" y="775" text-anchor="middle" font-size="17" font-weight="normal">The model is preloaded. This request does not train, send email, or follow links.</text>
</g></svg>