[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "phishguard"
version = "0.1.0"
description = "Phishing-email detection research: validated foundation contracts."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["pydantic>=2.12,<3"]

[project.scripts]
phishguard = "phishguard.cli:main"

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/phishguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
