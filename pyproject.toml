[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "phishguard"
version = "0.4.0"
description = "Phishing-email detection research: reproducible data and a classical baseline detector."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2,<3",
    "pydantic>=2.12,<3",
    "scikit-learn==1.9.1",
    "scipy>=1.13,<2",
    "threadpoolctl>=3.5,<4",
]

[project.scripts]
phishguard = "phishguard.cli:main"

[project.optional-dependencies]
pretrained = ["torch==2.15.0", "transformers==4.57.6", "safetensors==0.8.0"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/phishguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
