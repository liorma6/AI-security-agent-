name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.13.1
      - run: uv sync --locked --python ${{ matrix.python-version }}
      - run: uv run --frozen --python ${{ matrix.python-version }} ruff check .
      - run: uv run --frozen --python ${{ matrix.python-version }} ruff format --check .
      - run: uv run --frozen --python ${{ matrix.python-version }} pytest
      - run: uv run --frozen --python ${{ matrix.python-version }} python scripts/check_documents.py
      - run: uv build --python ${{ matrix.python-version }}
      - run: uv run --frozen --python ${{ matrix.python-version }} phishguard validate email --file tests/fixtures/email.json
