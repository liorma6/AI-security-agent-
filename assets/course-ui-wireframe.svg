<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710"><title>PhishGuard UI documentation wireframe</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#23727b"/></marker></defs><rect width="1200" height="710" fill="#ffffff"/><g font-family="Calibri,sans-serif"><text x="40" y="50" font-size="30" fill="#333e47" font-weight="bold">LOCAL EMAIL ANALYSIS</text><text x="40" y="84" font-size="20" fill="#333e47" font-weight="normal">Documentation wireframe of the implemented interface; values below are field labels.</text><rect x="40" y="115" width="540" height="475" rx="12" fill="#ffffff" stroke="#333e47"/><rect x="620" y="115" width="540" height="475" rx="12" fill="#ffffff" stroke="#333e47"/><text x="64" y="154" font-size="18" fill="#23727b" font-weight="bold">INPUT</text><text x="64" y="190" font-size="21" fill="#333e47" font-weight="normal">Choose a model</text><rect x="64" y="207" width="492" height="45" rx="12" fill="#ffffff" stroke="#333e47"/><text x="78" y="237" font-size="20" fill="#333e47" font-weight="normal">Four fixed model choices</text><text x="64" y="289" font-size="21" fill="#333e47" font-weight="normal">Subject (optional)</text><rect x="64" y="303" width="492" height="43" rx="12" fill="#ffffff" stroke="#333e47"/><text x="64" y="386" font-size="21" fill="#333e47" font-weight="normal">Email body</text><rect x="64" y="400" width="492" height="105" rx="12" fill="#ffffff" stroke="#333e47"/><rect x="64" y="528" width="328" height="40" rx="12" fill="#23727b" stroke="#333e47"/><text x="150" y="555" font-size="19" fill="white" font-weight="bold">Analyze email</text><rect x="410" y="528" width="146" height="40" rx="12" fill="#ffffff" stroke="#333e47"/><text x="451" y="555" font-size="19" fill="#333e47" font-weight="normal">Clear</text><text x="644" y="154" font-size="18" fill="#23727b" font-weight="bold">RESULT</text><text x="644" y="195" font-size="24" fill="#333e47" font-weight="bold">Score and decision</text><text x="644" y="228" font-size="18" fill="#333e47" font-weight="normal">Threshold selected on validation data</text><text x="644" y="290" font-size="24" fill="#333e47" font-weight="bold">Model identity</text><text x="644" y="323" font-size="18" fill="#333e47" font-weight="normal">Exact model / revision / threshold</text><text x="644" y="385" font-size="24" fill="#333e47" font-weight="bold">Length disclosure</text><text x="644" y="418" font-size="18" fill="#333e47" font-weight="normal">Original and used tokens; truncation</text><text x="644" y="480" font-size="24" fill="#333e47" font-weight="bold">Evidence and limitations</text><text x="644" y="513" font-size="18" fill="#333e47" font-weight="normal">Feature contributions or text indicators</text><text x="40" y="633" font-size="22" fill="#333e47" font-weight="normal">States: ready → analyzing → result; validation error or unavailable model when needed.</text><text x="40" y="671" font-size="20" fill="#333e47" font-weight="normal">Input stays local. No link following, message delivery or training from this screen.</text></g></svg>