<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="635" viewBox="0 0 1200 635"><title>PhishGuard simplified component overview</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#12535b"/></marker></defs><rect width="1200" height="635" fill="#f5f8f7"/><g font-family="Arial,sans-serif"><text x="40" y="48" font-size="30" fill="#183b40" font-weight="bold">COMPONENT OVERVIEW</text><text x="40" y="82" font-size="20" fill="#183b40" font-weight="normal">Online interaction reads frozen artifacts; research preparation and training run separately.</text><rect x="40" y="125" width="300" height="155" rx="12" fill="#ffffff" stroke="#9bb9b7"/><text x="58" y="162" font-size="23" fill="#12535b" font-weight="bold">Local browser</text><text x="58" y="208" font-size="18" fill="#183b40" font-weight="normal">Pasted subject / body</text><text x="58" y="240" font-size="18" fill="#183b40" font-weight="normal">Score, decision and evidence</text><rect x="450" y="125" width="300" height="155" rx="12" fill="#ffffff" stroke="#9bb9b7"/><text x="468" y="162" font-size="23" fill="#12535b" font-weight="bold">Demo controller</text><text x="468" y="208" font-size="18" fill="#183b40" font-weight="normal">Validate / serialize request</text><text x="468" y="240" font-size="18" fill="#183b40" font-weight="normal">Render private errors</text><rect x="860" y="125" width="300" height="155" rx="12" fill="#ffffff" stroke="#9bb9b7"/><text x="878" y="162" font-size="23" fill="#12535b" font-weight="bold">Inference registry</text><text x="878" y="208" font-size="18" fill="#183b40" font-weight="normal">Four reviewed adapters</text><text x="878" y="240" font-size="18" fill="#183b40" font-weight="normal">Fixed thresholds / token caps</text><rect x="40" y="375" width="300" height="155" rx="12" fill="#ffffff" stroke="#9bb9b7"/><text x="58" y="412" font-size="23" fill="#12535b" font-weight="bold">Reviewed datasets</text><text x="58" y="458" font-size="18" fill="#183b40" font-weight="normal">Pinned source / grouped splits</text><text x="58" y="490" font-size="18" fill="#183b40" font-weight="normal">Training / validation / tests</text><rect x="450" y="375" width="300" height="155" rx="12" fill="#ffffff" stroke="#9bb9b7"/><text x="468" y="412" font-size="23" fill="#12535b" font-weight="bold">Offline research CLI</text><text x="468" y="458" font-size="18" fill="#183b40" font-weight="normal">Prepare / train / evaluate</text><text x="468" y="490" font-size="18" fill="#183b40" font-weight="normal">Bounded attack and defense</text><rect x="860" y="375" width="300" height="155" rx="12" fill="#ffffff" stroke="#9bb9b7"/><text x="878" y="412" font-size="23" fill="#12535b" font-weight="bold">Frozen model artifacts</text><text x="878" y="458" font-size="18" fill="#183b40" font-weight="normal">Weights / vocabularies</text><text x="878" y="490" font-size="18" fill="#183b40" font-weight="normal">Manifests / identity / selection</text><line x1="340" y1="205" x2="445" y2="205" stroke="#12535b" stroke-width="4" marker-end="url(#arrow)"/><line x1="750" y1="205" x2="855" y2="205" stroke="#12535b" stroke-width="4" marker-end="url(#arrow)"/><line x1="340" y1="450" x2="445" y2="450" stroke="#12535b" stroke-width="4" marker-end="url(#arrow)"/><line x1="750" y1="450" x2="855" y2="450" stroke="#12535b" stroke-width="4" marker-end="url(#arrow)"/><line x1="1010" y1="375" x2="1010" y2="287" stroke="#12535b" stroke-width="4" marker-end="url(#arrow)"/><text x="40" y="594" font-size="21" fill="#183b40" font-weight="normal">No training command or arbitrary model path is exposed through the browser.</text></g></svg>