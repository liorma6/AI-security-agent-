name: ai-security-agent
services:
  api:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: "3001"
      APP_MODE: orchestration_test
      MONGO_URL: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379
      ALLOWED_TARGETS: ${ALLOWED_TARGETS:-}
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    read_only: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
  scanner:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
    command: ["node", "services/scanner/src/index.js"]
    environment:
      HOST: 0.0.0.0
      PORT: "3002"
      APP_MODE: orchestration_test
      MONGO_URL: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379
      ALLOWED_TARGETS: ${ALLOWED_TARGETS:-}
    ports:
      - "127.0.0.1:${SCANNER_PORT:-3002}:3002"
    read_only: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
  ml:
    build: ./services/ml
    ports:
      - "127.0.0.1:${ML_PORT:-8000}:8000"
    read_only: true
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 15
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:8080"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 15
    depends_on:
      api: { condition: service_healthy }
  mongo:
    image: mongo:8.0.34
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:8.2.11-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  mongo-data:
  redis-data:
